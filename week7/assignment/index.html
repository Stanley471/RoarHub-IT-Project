<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Weather Checker</h1>
  <form id="weatherForm" action="">
  <div class="input-group">
    <label for="lat">Latitude:</label>
    <input type="text" id="lat" placeholder="e.g. 6.5244">
  </div>
  <div class="input-group">
    <label for="lon">Longitude:</label>
    <input type="text" id="lon" placeholder="e.g. 3.3792">
  </div>
  <button id="submitBtn">Check Weather</button>
  </form>

  <div id="result"></div>

  <script src="script.js"></script>

</body>
</html>
